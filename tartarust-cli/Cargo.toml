[package]
name = "tartarust-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.5", features = ["derive"] }
colored = "3"
ecow = "0.3.0"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tartarust-lib.workspace = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true